# 同频生产部署：postgres + backend + frontend(nginx)
# 用法见 docs/deploy.md；变量从同目录 .env 读取（参考 .env.example）
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tongpin-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tongpin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tongpin}
      POSTGRES_DB: ${POSTGRES_DB:-tongpin}
    volumes:
      - tongpin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tongpin}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: tongpin-backend
    env_file: .env
    environment:
      # 容器内固定值：覆盖 .env 中的同名项
      APP_ENV: prod
      APP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-tongpin}:${POSTGRES_PASSWORD:-tongpin}@postgres:5432/${POSTGRES_DB:-tongpin}?sslmode=disable
      MATCH_POOL_THRESHOLD: ${MATCH_POOL_THRESHOLD:-500}
      STYLE_WORKER_INTERVAL: ${STYLE_WORKER_INTERVAL:-300}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    container_name: tongpin-frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  tongpin_pgdata:
